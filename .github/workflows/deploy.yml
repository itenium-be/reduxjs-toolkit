name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [redux-legacy, redux-modern]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: bun install --frozen-lockfile

      - name: Run tests
        working-directory: ${{ matrix.app }}
        run: bun run test:run

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install & build legacy
        working-directory: redux-legacy
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install & build modern
        working-directory: redux-modern
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy/legacy deploy/modern
          cp -r redux-legacy/dist/* deploy/legacy/
          cp -r redux-modern/dist/* deploy/modern/

      - name: Add landing page
        run: cp -r landing/* deploy/

      # Pages has no SPA fallback: client-side routes 404 on a cold load.
      # Pages only serves the site-root 404.html, so it holds the modern app.
      - name: Add SPA fallback
        run: cp redux-modern/dist/index.html deploy/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
